<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>007 CASINO ROYALE</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: "MS Gothic", "ＭＳ ゴシック", monospace;
        cursor: none;
      }
      #stage {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        /* size is set from display.ts */
      }
      #stage canvas {
        position: absolute;
        left: 0; top: 0;
        width: 100%; height: 100%;
        display: block;
      }
      /* low-res pixel layer */
      #game {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* native-res text/UI layer on top */
      #ui { pointer-events: none; }
      #boot {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        color: #c1182a; letter-spacing: .35em; font-size: 14px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <canvas id="ui"></canvas>
    </div>
    <div id="boot">LOADING&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
